<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陪伴学习 · 榆林市图书馆</title>
  <link rel="stylesheet" href="styles.css?v=20260922-focus-scenes-v3">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body class="theme-liquid-glass focus-mode">
  <main class="study-focus-page">
    <a class="focus-back" href="index.html#studySeats" aria-label="返回主界面"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
    <section class="study-focus-card" id="studyFocusCard" aria-live="polite">
      <div class="study-focus-content">
        <input class="study-focus-time" id="focusTimeInput" value="25:00" inputmode="numeric" aria-label="专注时长，格式为分钟:秒">
        <p id="focusState">设置时长后开始</p>
        <span>累计专注 <b id="focusTotal">00:00</b></span>
        <div class="focus-actions">
          <button class="focus-action focus-action--primary" id="focusStart" type="button"><i data-lucide="play" aria-hidden="true"></i><span>开始专注</span></button>
          <button class="focus-action" id="focusReset" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i><span>重置</span></button>
        </div>
      </div>
      <button class="focus-custom-trigger" id="focusCustomTrigger" type="button"><i data-lucide="image" aria-hidden="true"></i><span>自定义</span></button>
    </section>
  </main>

  <dialog class="focus-customizer" id="focusCustomizer" aria-label="选择专注背景">
    <button class="focus-customizer-close" id="focusCustomizerClose" type="button" aria-label="关闭背景选择"><i data-lucide="x" aria-hidden="true"></i></button>
    <div class="focus-customizer-grid">
      <button class="focus-scene-choice is-active" type="button" data-focus-bg="assets/focus/167ba3ee2486e620be05f09022e89593.jpg" aria-label="选择窗边湖景"><img src="assets/focus/167ba3ee2486e620be05f09022e89593.jpg" alt=""></button>
      <button class="focus-scene-choice" type="button" data-focus-bg="assets/focus/ae61dd4a0665c0775140e0bd4b8e915a.jpg" aria-label="选择夕阳茶席"><img src="assets/focus/ae61dd4a0665c0775140e0bd4b8e915a.jpg" alt=""></button>
      <button class="focus-scene-choice" type="button" data-focus-bg="assets/focus/ed74e841232ee311f7c8b18369432083.jpg" aria-label="选择山水冥想"><img src="assets/focus/ed74e841232ee311f7c8b18369432083.jpg" alt=""></button>
      <button class="focus-scene-choice" type="button" data-focus-bg="assets/focus/907abf43bb7f8aa62ff337f5516d858d.jpg" aria-label="选择麦田窗景"><img src="assets/focus/907abf43bb7f8aa62ff337f5516d858d.jpg" alt=""></button>
      <label class="focus-upload" aria-label="上传自定义背景"><i data-lucide="upload" aria-hidden="true"></i><input id="focusCustomBg" type="file" accept="image/*"></label>
    </div>
  </dialog>

  <script>
const key='yulin-study-session-v1', input=document.querySelector('#focusTimeInput'), state=document.querySelector('#focusState'), totalEl=document.querySelector('#focusTotal'), start=document.querySelector('#focusStart'), reset=document.querySelector('#focusReset'); let remaining=0,total=0,running=false,timer=null,session=0,countUp=false; const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; const read=()=>{const m=input.value.trim().match(/^(\d{1,3}):([0-5]\d)$/);return m?Math.min(14400,+m[1]*60 + +m[2]):1500}; const sync=()=>{localStorage.setItem(key,JSON.stringify({remaining,totalSeconds:total,sessionSeconds:session,running,countUp,updatedAt:Date.now()}));input.value=fmt(remaining);totalEl.textContent=fmt(total);state.textContent=running?'专注进行中 · 小程序同步中':(remaining?'已暂停':'准备开始');start.querySelector('span').textContent=running?'暂停专注':'开始专注'; start.querySelector('i')?.setAttribute('data-lucide', running?'pause':'play'); window.lucide?.createIcons();}; const tick=()=>{if(countUp){remaining++;total++;}else{remaining=Math.max(0,remaining-1);total++;if(!remaining){running=false;clearInterval(timer);timer=null;session=0;}}sync();}; try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){remaining=+s.remaining||0;total=+s.totalSeconds||0;session=+s.sessionSeconds||remaining;countUp=Boolean(s.countUp);}}catch{} if(!remaining&&!countUp)remaining=read(); sync(); input.addEventListener('input',()=>{if(!running && /^(\d{1,3}):([0-5]\d)$/.test(input.value.trim())){countUp=false;remaining=read();session=remaining;totalEl.textContent=fmt(total);state.textContent=remaining?'已暂停':'准备开始';}}); input.addEventListener('change',()=>{if(!running){countUp=false;remaining=read();session=remaining;sync();}}); start.addEventListener('click',()=>{if(running){running=false;clearInterval(timer);timer=null;}else{if(!remaining&&!countUp){session=read();remaining=session;}running=true;timer=setInterval(tick,1000);}sync();}); reset.addEventListener('click',()=>{running=false;clearInterval(timer);timer=null;remaining=0;session=0;countUp=true;sync();});
const focusCard=document.querySelector('#studyFocusCard'), customizer=document.querySelector('#focusCustomizer'), applyFocusBackground=source=>{const image=`url("${source}")`;focusCard.style.setProperty('--focus-bg',image);focusCard.style.backgroundImage=image;};
document.querySelectorAll('[data-focus-bg]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-focus-bg]').forEach(item=>item.classList.toggle('is-active',item===button));applyFocusBackground(button.dataset.focusBg);customizer.close();}));
document.querySelector('#focusCustomBg').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;applyFocusBackground(URL.createObjectURL(file));document.querySelectorAll('[data-focus-bg]').forEach(item=>item.classList.remove('is-active'));customizer.close();});
document.querySelector('#focusCustomTrigger').addEventListener('click',()=>customizer.showModal()); document.querySelector('#focusCustomizerClose').addEventListener('click',()=>customizer.close()); customizer.addEventListener('click',event=>{if(event.target===customizer)customizer.close();}); applyFocusBackground('assets/focus/167ba3ee2486e620be05f09022e89593.jpg'); window.lucide?.createIcons();
  </script>
</body>
</html>
