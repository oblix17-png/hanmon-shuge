<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>陪伴学习 · 榆林市图书馆</title><link rel="stylesheet" href="styles.css?v=20260921-study-focus-v2"><script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script></head>
<body class="theme-liquid-glass"><main class="study-focus-page"><a class="collection-back" href="index.html#studySeats">← 返回主界面</a><p class="eyebrow">FOCUS TOGETHER · 陪伴学习</p><h1>和小伙伴一起专注</h1><p class="study-focus-lead">选择一幅安静场景，或上传自己的图片，让专注计时显示在画面上。</p><div class="focus-scene-picker"><button class="is-active" type="button" data-focus-bg="assets/focus/167ba3ee2486e620be05f09022e89593.jpg"><img src="assets/focus/167ba3ee2486e620be05f09022e89593.jpg" alt="窗边湖景"></button><button type="button" data-focus-bg="assets/focus/ae61dd4a0665c0775140e0bd4b8e915a.jpg"><img src="assets/focus/ae61dd4a0665c0775140e0bd4b8e915a.jpg" alt="夕阳茶席"></button><button type="button" data-focus-bg="assets/focus/ed74e841232ee311f7c8b18369432083.jpg"><img src="assets/focus/ed74e841232ee311f7c8b18369432083.jpg" alt="山水冥想"></button><button type="button" data-focus-bg="assets/focus/907abf43bb7f8aa62ff337f5516d858d.jpg"><img src="assets/focus/907abf43bb7f8aa62ff337f5516d858d.jpg" alt="麦田窗景"></button><label class="focus-upload">上传自定义图片<input id="focusCustomBg" type="file" accept="image/*"></label></div><section class="study-focus-card" id="studyFocusCard" aria-live="polite"><div class="study-focus-content"><input class="study-focus-time" id="focusTimeInput" value="25:00" inputmode="numeric" aria-label="专注时长，格式为分钟:秒"><p id="focusState">设置时长后开始</p><span>累计专注 <b id="focusTotal">00:00</b></span><div><button class="primary-button" id="focusStart" type="button"><i data-lucide="play"></i><span>开始专注</span></button><button class="secondary-button" id="focusReset" type="button"><i data-lucide="rotate-ccw"></i>重置</button></div></div></section><p class="study-focus-sync">累计时长同步到 <a href="mini-program-demo.html">榆见书小程序样机</a>，网页与小程序倒计时彼此独立。</p></main><script>
const key='yulin-study-session-v1', input=document.querySelector('#focusTimeInput'), state=document.querySelector('#focusState'), totalEl=document.querySelector('#focusTotal'), start=document.querySelector('#focusStart'), reset=document.querySelector('#focusReset'); let remaining=0,total=0,running=false,timer=null,session=0; const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; const read=()=>{const m=input.value.trim().match(/^(\d{1,3}):([0-5]\d)$/);return m?Math.min(14400,+m[1]*60 + +m[2]):1500}; const sync=()=>{localStorage.setItem(key,JSON.stringify({remaining,totalSeconds:total,sessionSeconds:session,running,updatedAt:Date.now()}));input.value=fmt(remaining);totalEl.textContent=fmt(total);state.textContent=running?'专注进行中 · 小程序同步中':(remaining?'已暂停':'设置时长后开始');start.querySelector('span').textContent=running?'暂停专注':'开始专注';}; const tick=()=>{remaining=Math.max(0,remaining-1);total++;if(!remaining){running=false;clearInterval(timer);timer=null;session=0;}sync();}; try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){remaining=+s.remaining||0;total=+s.totalSeconds||0;session=+s.sessionSeconds||remaining;}}catch{} if(!remaining)remaining=read(); sync(); input.addEventListener('input',()=>{if(!running && /^(\d{1,3}):([0-5]\d)$/.test(input.value.trim())){remaining=read();session=remaining;totalEl.textContent=fmt(total);state.textContent=remaining?'已暂停':'设置时长后开始';}}); input.addEventListener('change',()=>{if(!running){remaining=read();session=remaining;sync();}}); start.addEventListener('click',()=>{if(running){running=false;clearInterval(timer);timer=null;}else{if(!remaining){session=read();remaining=session;}running=true;timer=setInterval(tick,1000);}sync();}); reset.addEventListener('click',()=>{running=false;clearInterval(timer);timer=null;remaining=read();session=remaining;sync();}); if(window.lucide)window.lucide.createIcons();
const focusCard = document.querySelector('#studyFocusCard');
const applyFocusBackground = source => {
  const image = `url("${source}")`;
  focusCard.style.setProperty('--focus-bg', image);
  focusCard.style.backgroundImage = image;
};
document.querySelectorAll('[data-focus-bg]').forEach(button => button.addEventListener('click', () => {
  document.querySelectorAll('[data-focus-bg]').forEach(item => item.classList.toggle('is-active', item === button));
  applyFocusBackground(button.dataset.focusBg);
}));
document.querySelector('#focusCustomBg').addEventListener('change', event => {
  const file = event.target.files[0];
  if (!file) return;
  applyFocusBackground(URL.createObjectURL(file));
  document.querySelectorAll('[data-focus-bg]').forEach(item => item.classList.remove('is-active'));
});
applyFocusBackground('assets/focus/167ba3ee2486e620be05f09022e89593.jpg');
</script></body></html>
